# GlazeWM, replacing komorebi (2026-10-14). Same workspaces, the same
# floating apps and workspace rules as komorebi.json had, ethereal palette.
# No keybindings on purpose: kanata (kanata.plain.kbd) and windows.ahk drive it
# through the CLI (`glazewm command ...`).
general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  # The pointer is not moved by the WM (it teleported during drags).
  focus_follows_cursor: false
  # false on purpose: with true, `move --workspace X` on a window already in X sends it
  # to the previous workspace, and GlazeWM re-runs the window rules at every reload, so a
  # reload bounced every window that has a workspace rule. The back-and-forth of the
  # workspace shortcuts is in windows.ahk (over the socket) instead.
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: false
    trigger: 'monitor_focus'
  # 'cloak' keeps hidden windows alive for apps that dislike being hidden.
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '0px'
  outer_gap:
    top: '0px'
    right: '0px'
    bottom: '0px'
    left: '0px'

# Palette: #7d82d9 blue, #6d7db6 comment, #060B1E background.
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7d82d9'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '100%'
  other_windows:
    border:
      enabled: false
      color: '#6d7db6'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    # Unfocused windows slightly transparent on purpose (Mia, 2026-10-14):
    # 98%. komorebi had 245/255 = 96%.
    transparency:
      enabled: true
      opacity: '98%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      # Not topmost: a fullscreen window set topmost stays above every floating
      # window, and Zen kept the flag even after leaving fullscreen (Mia, 2026-10-15).
      shown_on_top: false

# bind_to_monitor: 0 is the leftmost screen (left, centre, right). A workspace
# WITHOUT it opens on the monitor in focus (like a scratchpad: focus a monitor, call
# the workspace, it shows up there). left / main / right are the home screens; Editor
# (every video editor), Motion (every motion app) and Photo (Photoshop, Affinity...)
# are tied to the centre.
workspaces:
  - name: 'left'
    bind_to_monitor: 0
  - name: 'main'
    bind_to_monitor: 1
  - name: 'Editor'
    bind_to_monitor: 1
  - name: 'Motion'
    bind_to_monitor: 1
  - name: 'Photo'
    bind_to_monitor: 1
  - name: 'Nvim'
  - name: 'Browser'
  - name: 'Claude'
  - name: 'WhatsApp'
  - name: 'Scratchpad'
  - name: 'right'
    bind_to_monitor: 2

window_rules:
  # Zebar (GlazeWM's own bar, installed with it) is not used: yasb is the bar.
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }

  # floating_applications of the old komorebi.json
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'Flow.Launcher' }
      - window_class: { equals: 'CabinetWClass' }
      - window_process: { equals: 'Adobe Premiere Pro' }
      - window_process: { equals: 'Resolve' }
      - window_process: { equals: 'filmcraft' }
      - window_process: { equals: 'effectcraft' }
      - window_process: { equals: 'Cavalry' }
      - window_process: { equals: 'Photoshop' }
      - window_process: { equals: 'Affinity' }
      - window_process: { equals: 'photocraft' }
      - window_process: { equals: 'AfterFX' }
      - window_class: { equals: 'AE_CApplication' }
      - window_process: { equals: 'Epidemic Sound' }
      - window_process: { equals: 'Numi' }
      - window_class: { equals: 'floatterm' }

  # workspace rules (komorebi's initial_workspace_rules / workspace_rules)
  - commands: ['move --workspace Nvim']
    match:
      - window_process: { equals: 'nvim-wezterm' }
  - commands: ['move --workspace Motion']
    match:
      - window_process: { equals: 'AfterFX' }
      - window_process: { equals: 'effectcraft' }
      - window_process: { equals: 'Cavalry' }
  - commands: ['move --workspace Editor']
    match:
      - window_process: { equals: 'Adobe Premiere Pro' }
  - commands: ['move --workspace Editor']
    match:
      - window_process: { equals: 'Resolve' }
      - window_process: { equals: 'filmcraft' }
  - commands: ['move --workspace Photo']
    match:
      - window_process: { equals: 'Photoshop' }
      - window_process: { equals: 'Affinity' }
      - window_process: { equals: 'photocraft' }
  - commands: ['move --workspace Browser']
    match:
      - window_process: { equals: 'zen' }
  - commands: ['move --workspace Claude']
    match:
      - window_process: { equals: 'claude' }
        window_class: { equals: 'Chrome_WidgetWin_1' }
  - commands: ['move --workspace WhatsApp']
    match:
      - window_process: { equals: 'WhatsApp.Root' }
  # The Chrome app windows (YouTube) opened by the MX Creative Console macro ask for
  # --window-position=3840,0, but GlazeWM puts a new window on the workspace of the
  # focused container and ignores that position (Mia, 2026-10-15). Zen is the
  # browser in use, so every Chrome window goes to the right monitor.
  - commands: ['move --workspace right']
    match:
      - window_process: { equals: 'chrome' }

binding_modes: []

# kanata sends these chords (Ctrl+Alt+Win + key, the ones whkd used to take) for
# the simple window actions: GlazeWM catches them itself, no CLI process in
# between (Mia, 2026-10-15). The ones with logic (workspaces back and forth,
# moving a floating window to another monitor, quick look...) stay as kanata
# cmd actions with nu.
keybindings:
  - commands: ['focus --direction left']
    bindings: ['ctrl+alt+lwin+h']
  - commands: ['move --direction left']
    bindings: ['ctrl+alt+lwin+shift+h']
  - commands: ['focus --direction down']
    bindings: ['ctrl+alt+lwin+j']
  - commands: ['move --direction down']
    bindings: ['ctrl+alt+lwin+shift+j']
  - commands: ['focus --direction up']
    bindings: ['ctrl+alt+lwin+k']
  - commands: ['move --direction up']
    bindings: ['ctrl+alt+lwin+shift+k']
  - commands: ['focus --direction right']
    bindings: ['ctrl+alt+lwin+l']
  - commands: ['move --direction right']
    bindings: ['ctrl+alt+lwin+shift+l']
  - commands: ['toggle-floating']
    bindings: ['ctrl+alt+lwin+f']
  - commands: ['toggle-fullscreen --maximized']
    bindings: ['ctrl+alt+lwin+shift+f']
  - commands: ['toggle-minimized']
    bindings: ['ctrl+alt+lwin+i']
  - commands: ['wm-cycle-focus']
    bindings: ['ctrl+alt+lwin+oem_open_brackets', 'ctrl+alt+lwin+oem_close_brackets']
  - commands: ['focus --monitor 0']
    bindings: ['ctrl+alt+lwin+1']
  - commands: ['focus --monitor 1']
    bindings: ['ctrl+alt+lwin+2']
  - commands: ['focus --monitor 2']
    bindings: ['ctrl+alt+lwin+3']
  - commands: ['focus --workspace-in-direction left']
    bindings: ['ctrl+alt+lwin+oem_comma']
  - commands: ['focus --workspace-in-direction right']
    bindings: ['ctrl+alt+lwin+oem_period']
  - commands: ['wm-reload-config']
    bindings: ['ctrl+alt+lwin+shift+o']
