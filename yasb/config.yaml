# yasb in the ethereal colours (2026-10-14): a pill-shaped bar with a thin
# border; small round workspace dots and the media on the left, the clock in
# the middle, Todoist, tray, memory, CPU and notifications on the right.
# Only colours of the theme palette (see styles.css). Styles in styles.css.
watch_stylesheet: true
watch_config: true
debug: false
update_check: true

bars:
  status-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
      # Out of the way of fullscreen windows (video, games, presentations).
      hide_on_fullscreen: true
    dimensions:
      width: "100%"
      height: 40
    # Edge to edge (Mia, 2026-10-15): no margin around the bar, only its rounded corners.
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["workspace_badge", "media"]
      center: ["clock"]
      right: ["todoist", "systray", "memory", "cpu", "notifications"]

widgets:
  # The vim-like mode (2026-10-08): one letter (I in INSERT).
  # 2026-10-09: a widget of its own (yasb-src, kanata_mode.py) listens to
  # kanata's TCP server (port 9999) and changes the letter on every layer
  # change, no polling and no komokana in between. Layers not listed in
  # modes (CapsLock, the accents, Win held) keep the last letter.
  # Two looks in the same place: the label is a small round badge, the
  # alternative label the letter alone (as the workspace names); a left
  # click switches between them (Mia, 2026-10-08).
  vim_mode:
    type: "yasb.kanata_mode.KanataModeWidget"
    options:
      label: "{mode}"
      label_alt: "{mode}"
      class_name: "vim-mode"
      port: 9999
      modes:
        base: "I"
        premiere: "I"
        zen: "I"
        window: "W"
        goto: "G"
        move: "M"
        resize: "R"
        cmdline: ":"
        hint: "F"
      # Space in WINDOW: a letter over each window of this monitor, to pick one
      # (kanata's hint layer; the letter pushes "hint <n>").
      hints:
        keys: ["a", "s", "d", "f", "j", "k", "l", ";"]
      # kanata's base layer by the app in focus (2026-10-09, in place of
      # komokana, which kept losing komorebi's focus events). Premiere and
      # After Effects: CapsLock tap = Delete. Zen: Win+W closes a tab.
      app_layers:
        "Adobe Premiere Pro.exe": "premiere"
        "AfterFX.exe": "premiere"
        "zen.exe": "zen"
      callbacks:
        on_left: "toggle_label"

  # The next Todoist task with a time today and how long until it (2026-10-09,
  # yasb-src: todoist_reminders.py). When its time comes, a small card opens
  # under the bar until answered: Done, +10 min or Close. A click opens it.
  # The token is Neovim's (nvim-data\todoist_token).
  todoist:
    type: "yasb.todoist_reminders.TodoistRemindersWidget"
    options:
      label: "{task} · {when}"
      label_max_length: 36
      class_name: "todoist"
      # Played when a card opens on its own ("" = silent). Mia, 2026-10-09:
      # the calendar chime was too quiet, an alarm instead.
      sound: 'C:\Windows\Media\Alarm05.wav'

  # The workspace as one letter in a round badge (Mia, 2026-10-15), the look of the
  # vim mode badge. The dots below (glazewm_workspaces) are kept, off the bar.
  workspace_badge:
    type: "yasb.glazewm_badge.GlazewmBadgeWidget"
    options:
      class_name: "workspace-badge"
      show_unfocused: true
      # main and Motion would both be M: main is H (home).
      labels:
        main: "H"

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: ""
      # Small round dots (2026-10-14): the colour tells the state (see
      # styles.css), the dot's size too. GlazeWM lists only the workspaces
      # that have windows (or are focused), so empty ones never show.
      populated_label: "●"
      empty_label: "●"
      active_populated_label: "●"
      active_empty_label: "●"
      focused_populated_label: "●"
      focused_empty_label: "●"
      hide_if_offline: true
      monitor_exclusive: true
      enable_scroll_switching: false

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}"
      separator: " · "
      hide_empty: true
      max_field_size:
        label: 30
        label_alt: 40
      show_thumbnail: false
      controls_hide: true

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 14
      max_length: 60
      max_length_ellipsis: "…"
      monitor_exclusive: true

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: ""
      label_expanded: ""
      label_position: "left"
      icon_size: 14
      show_unpinned: false
      show_unpinned_button: true

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span></span> {virtual_mem_percent}%"
      label_alt: "<span></span> {virtual_mem_free}"
      update_interval: 3000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span></span> {info[percent][total]}%"
      label_alt: "<span></span> {info[freq][current]} MHz"
      update_interval: 3000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}"
      label_alt: "{%a %d/%m %H:%M}"
      locale: "pt_BR"
      update_interval: 1000
      calendar:
        alignment: "right"
        direction: "down"
        show_week_numbers: false
        show_holidays: false

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span></span> {count}"
      label_alt: "{count} notifications"
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: "toggle_notification"
        on_right: "do_nothing"
        on_middle: "toggle_label"
